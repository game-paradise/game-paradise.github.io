    </pattern>
    <pattern id="stars" width="260" height="260" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="30" r="1.3" fill="#fff" opacity=".7"/>
      <circle cx="170" cy="70" r="1" fill="#bff7ff" opacity=".6"/>
      <circle cx="230" cy="190" r="1.5" fill="#fff" opacity=".5"/>
      <circle cx="100" cy="160" r="1" fill="#fff" opacity=".6"/>
      <circle cx="30" cy="225" r="1.2" fill="#d9ffe9" opacity=".55"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b3"/><stop offset="1" stop-color="#f5a623"/></linearGradient>
