<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Achtergrond">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d22"/>
      <stop offset="1" stop-color="#05071a"/>
    </linearGradient>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff62d3" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff62d3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1920" height="1080" fill="url(#fade)"/></mask>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="stars" width="240" height="240" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="40" r="1.4" fill="#fff" opacity=".7"/>
      <circle cx="150" cy="25" r="1" fill="#cfc8ff" opacity=".6"/>
      <circle cx="210" cy="110" r="1.6" fill="#fff" opacity=".5"/>
      <circle cx="90" cy="150" r="1" fill="#fff" opacity=".6"/>
      <circle cx="40" cy="215" r="1.2" fill="#ffd98a" opacity=".6"/>
      <circle cx="175" cy="200" r="1.1" fill="#fff" opacity=".45"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="520" cy="220" rx="720" ry="520" fill="url(#g1)"/>
  <ellipse cx="1500" cy="300" rx="640" ry="460" fill="url(#g2)"/>
  <ellipse cx="1000" cy="980" rx="900" ry="420" fill="url(#g3)"/>
  <rect width="1920" height="1080" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1920" height="1080" fill="url(#stars)"/>

  <!-- gouden sparkles -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-width="3" opacity=".8">
    <path d="M300 180v22M289 191h22"/>
    <path d="M1620 140v18M1611 149h18" opacity=".7"/>
    <path d="M1360 760v26M1347 773h26" opacity=".9"/>
    <path d="M220 800v16M212 808h16" opacity=".6"/>
  </g>
</svg>
