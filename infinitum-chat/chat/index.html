<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050816">
  <title>Infinitum Chat</title>
  <script>
    /* thema + achtergrond meteen toepassen (voorkomt een flits bij het laden) */
    try {
      var s = JSON.parse(localStorage.getItem('infinitum-settings') || '{}');
      var t = s.theme || 'dark';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.bg = ['cosmos', 'aurora', 'sunset', 'ocean'].indexOf(s.bg) > -1 ? s.bg : 'cosmos';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
  <script type="module" src="js/app.js?v=4"></script>
</head>
<body>
  <!-- gedeelde gradient voor het verstuur-icoon -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gradSend" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7c5cff"/>
        <stop offset=".55" stop-color="#c24dff"/>
        <stop offset="1" stop-color="#ff62d3"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ===== inloggen ===== -->
  <section id="auth" class="auth">
    <div class="auth-card panel">
      <img class="auth-logo" src="assets/infinitum-logo.svg" alt="Infinitum">
      <div class="seg" id="authSeg">
        <button type="button" data-mode="login" class="active">Inloggen</button>
        <button type="button" data-mode="signup">Account maken</button>
      </div>
      <form id="authForm" novalidate>
        <label class="field" id="userField" hidden>
          <span>Gebruikersnaam</span>
          <input id="aUser" autocomplete="username" maxlength="20" placeholder="bijv. kaasfan">
        </label>
        <label class="field">
          <span>E-mail</span>
          <input id="aMail" type="email" autocomplete="email" placeholder="jij@voorbeeld.nl">
        </label>
        <label class="field">
          <span>Wachtwoord</span>
          <input id="aPass" type="password" autocomplete="current-password" placeholder="Minimaal 6 tekens">
        </label>
        <p id="aErr" class="err" role="alert"></p>
        <button class="glow wide" id="aSubmit" type="submit">Inloggen</button>
      </form>
      <div class="or"><span>of</span></div>
      <button class="ghost wide" id="aGoogle" type="button">Doorgaan met Google</button>
    </div>
  </section>

  <!-- ===== de app ===== -->
  <div id="app" class="app" data-view="list" hidden>
    <header class="topbar panel">
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="dms">DM's</button>
        <button class="tab" data-tab="servers">Servers</button>
        <button class="tab" data-tab="friends">Friends</button>
        <button class="tab" data-tab="requests">Requests<span class="badge" id="reqBadge" hidden></span></button>
      </nav>
      <button class="glow premium" id="premiumBtn" type="button" aria-label="Infinitum Premium">
        <img src="assets/logo-dark.svg" alt="Infinitum">
      </button>
    </header>

    <aside class="sidebar panel">
      <div class="me">
        <span id="meAvatar"></span>
        <div class="me-text">
          <span class="me-name" id="meName">…</span>
        </div>
        <button class="icon-btn" id="settingsBtn" type="button" title="Instellingen" aria-label="Instellingen"></button>
        <button class="icon-btn" id="logoutBtn" type="button" title="Uitloggen" aria-label="Uitloggen"></button>
      </div>
      <div class="flowline"></div>
      <h3 class="side-title" id="sideTitle">Directe berichten</h3>
      <div class="side-list" id="sideList"></div>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <main class="main panel" id="main"></main>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
