<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Achtergrond Aurora">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04121f"/>
      <stop offset="1" stop-color="#030a16"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19e3b1" stop-opacity="0"/>
      <stop offset=".35" stop-color="#19e3b1" stop-opacity=".75"/>
      <stop offset=".7" stop-color="#3b82f6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset=".4" stop-color="#8f7bff" stop-opacity=".6"/>
      <stop offset=".75" stop-color="#ff62d3" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff62d3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#19e3b1" stop-opacity=".3"/>
      <stop offset="1" stop-color="#19e3b1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="46"/></filter>
    <radialGradient id="fade" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="gridMask"><rect width="1920" height="1080" fill="url(#fade)"/></mask>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
