  </g>
  <rect width="1920" height="1080" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1920" height="1080" fill="url(#stars)"/>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-width="3" opacity=".8">
    <path d="M360 150v22M349 161h22"/>
